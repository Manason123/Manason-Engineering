# Netlify hosts ONLY the web app (client). The API/database runs elsewhere (see docs/DEPLOY-NETLIFY.md).
# Set VITE_API_URL in Netlify > Site configuration > Environment variables BEFORE building.
[build]
  base    = "client"
  command = " npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL="https://URL-YAWE-NYAYO.onrender.com"
[[headers]]
  from = "/*"
  to ="/index.html"
  status = 200
  
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
