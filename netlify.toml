# Netlify hosts ONLY the web app (client). The API/database runs elsewhere (see docs/DEPLOY-NETLIFY.md).
# Set VITE_API_URL in Netlify > Site configuration > Environment variables BEFORE building.
[build]
  base    = "client"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
